<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WundCheck — L4</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --ink:#12202e; --muted:#5d7186; --line:#dde5ee;
    --accent:#1f6feb; --green:#1a7f4b; --yellow:#b07d00; --orange:#c25c07; --red:#c0281c;
    --green-bg:#e8f6ee; --yellow-bg:#fdf5e0; --orange-bg:#fdeee1; --red-bg:#fdeceb;
    --radius:14px; --shadow:0 1px 2px rgba(16,32,48,.06),0 6px 18px rgba(16,32,48,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .bar{max-width:860px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
  .ver{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
       border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .langs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
  .langs button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;
                font:inherit;font-size:13px;font-weight:600;color:var(--muted)}
  .langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
  main{max-width:860px;margin:0 auto;padding:24px 20px 80px}
  .banner{background:#fff8e6;border:1px solid #f0dfae;border-radius:var(--radius);
          padding:12px 16px;font-size:13.5px;color:#6b5518;margin-bottom:22px}
  section.sec{margin-bottom:28px}
  section.sec > h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
                   margin:0 0 12px;font-weight:700}
  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
     padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow)}
  .q > label.lbl{display:block;font-weight:600;margin-bottom:12px}
  .q .req{color:var(--red);margin-left:3px}
  .q .src{font-size:11.5px;color:var(--muted);margin-top:10px;font-style:italic}
  input[type=text],input[type=number],input[type=date]{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    font:inherit;background:#fff}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{flex:1 1 150px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;
       cursor:pointer;display:flex;align-items:center;gap:10px;background:#fff;transition:.12s}
  .opt:hover{border-color:#b9c8da}
  .opt input{margin:0;accent-color:var(--accent);flex:none}
  .opt.sel{border-color:var(--accent);background:#f0f6ff;box-shadow:inset 0 0 0 1px var(--accent)}
  .opt img{width:56px;height:56px;flex:none;border-radius:8px;background:#fafcfe;border:1px solid var(--line)}
  .opt.img{flex:1 1 190px;flex-direction:column;align-items:flex-start;text-align:left}
  .opt.img img{width:100%;height:92px;object-fit:contain}
  .opt .otxt{font-size:14.5px}
  .err{color:var(--red);font-size:13px;margin-top:8px;font-weight:500}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
  button.btn{border:0;border-radius:11px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .result{border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;border:1.5px solid}
  .result h3{margin:0 0 8px;font-size:22px;letter-spacing:-.01em}
  .result p{margin:0;font-size:16.5px}
  .result .rid{font-size:12px;opacity:.75;margin-top:12px;font-variant-numeric:tabular-nums}
  .green{background:var(--green-bg);border-color:#a8d9bf;color:var(--green)}
  .yellow{background:var(--yellow-bg);border-color:#e8d194;color:var(--yellow)}
  .orange{background:var(--orange-bg);border-color:#f0c19a;color:var(--orange)}
  .red{background:var(--red-bg);border-color:#f0aca6;color:var(--red)}
  .notes{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:6px 20px;box-shadow:var(--shadow)}
  .notes li{margin:12px 0;font-size:15px}
  details.dev{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  details.dev summary{cursor:pointer;padding:15px 20px;font-weight:600;font-size:14.5px;list-style:none}
  details.dev summary::-webkit-details-marker{display:none}
  details.dev summary::before{content:"▸ ";color:var(--muted)}
  details.dev[open] summary::before{content:"▾ "}
  .devbody{padding:0 20px 20px;border-top:1px solid var(--line);padding-top:16px}
  table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
  table.kv td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.kv td:first-child{color:var(--muted);white-space:nowrap;width:1%;padding-right:16px}
  table.kv code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);
                padding:1px 5px;border-radius:5px}
  .thr input{width:96px;padding:5px 8px;font-size:13px;text-align:right}
  .hint{font-size:12.5px;color:var(--muted);margin-top:12px}
  .sendbox{margin-top:14px;padding:14px 18px;border-radius:12px;border:1px solid var(--line);
           background:#fff;font-size:14px;box-shadow:var(--shadow)}
  .sendbox code{font:12px ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:5px}
  .sendbox.ok{background:var(--green-bg);border-color:#a8d9bf}
  .sendbox.warn{background:var(--yellow-bg);border-color:#e8d194}
  .sendbox.bad{background:var(--red-bg);border-color:#f0aca6}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;
        background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
  @media(max-width:560px){ .opt{flex:1 1 100%} .opt.img{flex:1 1 46%} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">WundCheck</span>
    <span class="ver" id="verBadge">L3 —</span>
    <span class="spacer"></span>
    <div class="langs" id="langs"></div>
  </div>
</header>

<main>
  <div class="banner" id="disclaimer"></div>
  <form id="form" novalidate></form>

  <div class="actions">
    <button type="button" class="btn primary" id="btnEval"></button>
    <button type="button" class="btn ghost" id="btnNewDay"></button>
    <button type="button" class="btn primary" id="btnSend"></button>
    <button type="button" class="btn ghost" id="btnFhir"></button>
    <button type="button" class="btn ghost" id="btnLoad"></button>
    <input type="file" id="fileL3" accept=".json" hidden>
  </div>

  <div id="output"></div>

  <details class="dev">
    <summary id="devTitle"></summary>
    <div class="devbody" id="devBody"></div>
  </details>
</main>

<script>
/* ============================================================
   WundCheck L4 — generic renderer + rule engine.
   Contains NO clinical content: every question, threshold and
   rule is read from the L3 definition. Swapping the L3 file
   changes the CDSS without touching a line of this code.
   ============================================================ */

const UI = {
  en:{ evaluate:"Evaluate check", newDay:"New day", fhir:"Download FHIR bundle", send:"Send to patient record", load:"Load L3 file",
       sending:"Sending transaction bundle to", sent:"accepted by the FHIR server",
       queued:"queued — endpoint unreachable, will be retried", noEndpoint:"No FHIR endpoint configured in the L3",
       retry:"Retry queue", endpoint:"FHIR endpoint", queue:"Outbound queue",
       dev:"L3 inspector — version, thresholds, derived values", version:"Version", scope:"Scope",
       thresholds:"Thresholds (editable — changing a value changes the CDSS, with no rebuild)",
       derived:"Derived values", sources:"L1 sources", notes:"Additional notes", fix:"Please complete the fields marked in red.",
       required:"This field is required.", day:"Day", noneYet:"— not evaluated yet —",
       reapply:"Apply & re-evaluate", history:"Checks this session", source:"Source" },
  de:{ evaluate:"Kontrolle auswerten", newDay:"Neuer Tag", fhir:"FHIR-Bundle herunterladen", send:"An Patientenakte senden", load:"L3-Datei laden",
       sending:"Sende Transaction-Bundle an", sent:"vom FHIR-Server angenommen",
       queued:"in Warteschlange — Endpunkt nicht erreichbar, wird erneut versucht", noEndpoint:"Kein FHIR-Endpunkt im L3 konfiguriert",
       retry:"Warteschlange erneut senden", endpoint:"FHIR-Endpunkt", queue:"Ausgangs-Warteschlange",
       dev:"L3-Inspektor — Version, Schwellenwerte, abgeleitete Werte", version:"Version", scope:"Scope",
       thresholds:"Schwellenwerte (editierbar — eine Änderung verändert das CDSS, ohne Rebuild)",
       derived:"Abgeleitete Werte", sources:"L1-Quellen", notes:"Zusätzliche Hinweise", fix:"Bitte die rot markierten Felder ausfüllen.",
       required:"Dieses Feld ist erforderlich.", day:"Tag", noneYet:"— noch nicht ausgewertet —",
       reapply:"Übernehmen & neu auswerten", history:"Kontrollen in dieser Sitzung", source:"Quelle" }
};

let L3 = null, lang = "en", answers = {}, derived = {}, history = [], errors = {}, lastResult = null;

const t  = k => (UI[lang] || UI.en)[k];
const tx = v => v == null ? "" : (typeof v === "object" ? (v[lang] ?? v.en ?? Object.values(v)[0]) : v);

/* ---------- expression engine ---------- */
const DATE_IDS = () => L3.elements.filter(e => e.type === "date").map(e => e.id);

function compile(expr){
  let js = String(expr)
    .replace(/\band\b/g, "&&").replace(/\bor\b/g, "||").replace(/\bnot\b/g, "!")
    .replace(/(?<![<>=!])=(?!=)/g, "==");
  return js;
}
function scope(){
  const s = Object.create(null);
  for (const e of L3.elements){
    let v = (e.type === "calculated") ? derived[e.id] : answers[e.id];
    if (e.type === "date" && v) v = new Date(v).getTime();
    if (v === "" || v === undefined) v = null;
    s[e.id] = v;
  }
  s.classification = lastResult ? lastResult.priority : null;
  return s;
}
const HELPERS = {
  today: () => Date.now(),
  ageYears: d => d ? Math.floor((Date.now() - d) / 31557600000) : null,
  daysSince: d => d ? Math.floor((Date.now() - d) / 86400000) : null,
  round1: x => x == null ? null : Math.round(x * 10) / 10,
  severityRank: p => ({green:0, yellow:1, orange:2, red:3})[p] ?? -1,
  previousClassification: () => history.length ? history[history.length - 1].priority : null,
  consecutiveDays: () => history.length + 1
};
function evaluate(expr, extra){
  const s = Object.assign(scope(), extra || {});
  const names = Object.keys(s), vals = names.map(n => s[n]);
  const hn = Object.keys(HELPERS), hv = hn.map(n => HELPERS[n]);
  try{
    return new Function(...names, ...hn, "T", "return (" + compile(expr) + ");")
             (...vals, ...hv, L3.meta.thresholds);
  }catch(err){
    console.warn("expr failed:", expr, err);
    return null;
  }
}
function recalcDerived(){
  derived = {};
  for (let pass = 0; pass < 3; pass++)
    for (const e of L3.elements)
      if (e.type === "calculated" && e.calculation) derived[e.id] = evaluate(e.calculation);
}
function isVisible(e){ return !e.relevant || evaluate(e.relevant) === true; }

/* ---------- rendering ---------- */
function render(){
  document.documentElement.lang = lang;
  document.getElementById("verBadge").textContent = "L3 v" + L3.meta.version;
  document.getElementById("disclaimer").textContent = tx(L3.meta.disclaimer);
  document.title = tx(L3.meta.title);
  for (const [id, k] of [["btnEval","evaluate"],["btnNewDay","newDay"],["btnSend","send"],["btnFhir","fhir"],["btnLoad","load"]])
    document.getElementById(id).textContent = t(k);
  document.getElementById("devTitle").textContent = t("dev");

  const langs = document.getElementById("langs");
  langs.innerHTML = "";
  for (const L of (L3.meta.languages || ["en"])){
    const b = document.createElement("button");
    b.textContent = L.toUpperCase();
    b.setAttribute("aria-pressed", String(L === lang));
    b.onclick = () => { lang = L; render(); if (lastResult) show(lastResult); };
    langs.appendChild(b);
  }

  recalcDerived();
  const form = document.getElementById("form");
  form.innerHTML = "";

  for (const sec of L3.sections){
    if (sec.hidden) continue;
    if (sec.once && history.length) continue;
    const els = L3.elements.filter(e => e.section === sec.id && e.type !== "calculated" && isVisible(e));
    if (!els.length) continue;
    const s = document.createElement("section");
    s.className = "sec";
    s.innerHTML = "<h2>" + tx(sec.title) + "</h2>";
    els.forEach(e => s.appendChild(field(e)));
    form.appendChild(s);
  }
  renderDev();
}

function field(e){
  const d = document.createElement("div");
  d.className = "q";
  const lab = document.createElement("label");
  lab.className = "lbl";
  lab.innerHTML = tx(e.label) + (e.required ? '<span class="req">*</span>' : "")
                + '<span class="pill">' + e.de_id + "</span>";
  d.appendChild(lab);

  if (e.type === "select_one"){
    const wrap = document.createElement("div");
    wrap.className = "opts";
    const withImg = e.options.some(o => o.image);
    for (const o of e.options){
      const l = document.createElement("label");
      l.className = "opt" + (withImg ? " img" : "") + (answers[e.id] == o.value ? " sel" : "");
      const r = document.createElement("input");
      r.type = "radio"; r.name = e.id; r.value = o.value;
      r.checked = answers[e.id] == o.value;
      r.onchange = () => { answers[e.id] = o.value; delete errors[e.id]; render(); };
      if (o.image){
        const im = document.createElement("img");
        im.src = o.image; im.alt = tx(o.label);
        im.onerror = () => { im.style.display = "none"; };
        l.appendChild(im);
      }
      const row = document.createElement("span");
      row.className = "otxt";
      row.append(r, " " + tx(o.label));
      l.appendChild(row);
      wrap.appendChild(l);
    }
    d.appendChild(wrap);
  } else {
    const i = document.createElement("input");
    i.type = (e.type === "date") ? "date" : (e.type === "text") ? "text" : "number";
    if (e.type === "decimal") i.step = "0.1";
    i.value = answers[e.id] ?? "";
    i.oninput = () => {
      const v = i.value;
      answers[e.id] = (v === "") ? "" : (e.type === "text" || e.type === "date") ? v : Number(v);
      delete errors[e.id];
      recalcDerived();
    };
    i.onblur = () => render();
    d.appendChild(i);
  }
  if (errors[e.id]){
    const p = document.createElement("div");
    p.className = "err"; p.textContent = errors[e.id];
    d.appendChild(p);
  }
  if (e.l1_source){
    const p = document.createElement("div");
    p.className = "src"; p.textContent = t("source") + ": " + e.l1_source;
    d.appendChild(p);
  }
  return d;
}

/* ---------- validation + rule evaluation (worst-first) ---------- */
function validate(){
  errors = {};
  for (const e of L3.elements){
    if (e.type === "calculated" || !isVisible(e)) continue;
    const v = answers[e.id];
    const empty = (v === undefined || v === "" || v === null);
    if (e.required && empty){ errors[e.id] = t("required"); continue; }
    if (!empty && e.constraint && evaluate(e.constraint.expr) !== true)
      errors[e.id] = tx(e.constraint.message);
  }
  return Object.keys(errors).length === 0;
}

const RANK = { green:0, yellow:1, orange:2, red:3 };
function runRules(){
  recalcDerived();
  let main = null;
  for (const r of L3.decision_rules){
    if (!r.exclusive) continue;
    if (evaluate(r.when) === true){ main = r; break; }
  }
  const notes = L3.decision_rules.filter(r => !r.exclusive && evaluate(r.when) === true);
  return { rule: main, notes, priority: main ? main.priority : null };
}
/* Two passes: a rule may reference `classification`, which only exists after
   the first pass. The worse of the two results wins — worst-first also applies
   across passes, so a second pass can escalate but never de-escalate. */
function classify(){
  const prev = lastResult;
  const first = runRules();
  lastResult = first;
  const second = runRules();
  lastResult = prev;
  return (RANK[second.priority] > RANK[first.priority]) ? second : first;
}

/* Extra badges on the result line are declared in meta.display.result_badge —
   the app does not know any clinical element by name. */
function badgeExtras(){
  return ((L3.meta.display && L3.meta.display.result_badge) || [])
    .map(b => " · " + tx(b.label) + " " + (derived[b.element] ?? "—")).join("");
}
function show(res){
  lastResult = res;
  recalcDerived();
  const out = document.getElementById("output");
  out.innerHTML = "";
  if (!res.rule) return;

  const box = document.createElement("div");
  box.className = "result " + res.rule.priority;
  const head = { green:"🟢", yellow:"🟡", orange:"🟠", red:"🔴" }[res.rule.priority] || "";
  const txt = tx(res.rule.output);
  const dash = txt.indexOf("—");
  box.innerHTML =
    "<h3>" + head + " " + (dash > 0 ? txt.slice(0, dash).trim() : "") + "</h3>" +
    "<p>" + (dash > 0 ? txt.slice(dash + 1).trim() : txt) + "</p>" +
    '<div class="rid">' + res.rule.id +
      (res.rule.reference ? " · " + res.rule.reference : "") +
      badgeExtras() + "</div>";
  out.appendChild(box);

  if (res.notes.length){
    const n = document.createElement("div");
    n.className = "notes";
    n.innerHTML = "<ul>" + res.notes
      .map(r => "<li>" + tx(r.output) + ' <span class="pill">' + r.id + "</span></li>").join("") + "</ul>";
    out.appendChild(n);
  }
  renderDev();
  out.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- L3 inspector ---------- */
function renderDev(){
  const b = document.getElementById("devBody");
  const th = Object.entries(L3.meta.thresholds).map(([k, v]) =>
    "<tr><td><code>" + k + "</code></td><td class='thr'><input type='number' step='0.1' value='" + v +
    "' data-thr='" + k + "'></td><td style='color:var(--muted);font-size:12px'>" +
    ((L3.meta.threshold_sources || {})[k] || "") + "</td></tr>").join("");
  const dv = L3.elements.filter(e => e.type === "calculated").map(e =>
    "<tr><td><code>" + e.id + "</code></td><td>" +
    (derived[e.id] === null || derived[e.id] === undefined ? "—" : derived[e.id]) + "</td></tr>").join("");
  const src = (L3.meta.l1_sources || []).map(s =>
    "<tr><td>" + s.role + "</td><td>" + (s.url ? "<a href='" + s.url + "' target='_blank' rel='noopener'>" + s.title + "</a>" : s.title) + "</td></tr>").join("");
  const hist = history.length
    ? "<table class='kv'>" + history.map((h, i) =>
        "<tr><td>" + t("day") + " " + (i + 1) + "</td><td>" + h.priority + " · " + h.rule + "</td></tr>").join("") + "</table>"
    : "<div class='hint'>" + t("noneYet") + "</div>";

  b.innerHTML =
    "<table class='kv'>" +
      "<tr><td>" + t("version") + "</td><td><code>" + L3.meta.version + "</code> · " +
        L3.elements.length + " elements · " + L3.decision_rules.length + " rules</td></tr>" +
      "<tr><td>" + t("scope") + "</td><td>" + tx(L3.meta.scope) + "</td></tr>" +
    "</table>" +
    "<h4 style='margin:18px 0 6px;font-size:13px'>" + t("thresholds") + "</h4>" +
    "<table class='kv'>" + th + "</table>" +
    "<button type='button' class='btn ghost' id='btnThr' style='margin-top:12px;padding:9px 16px;font-size:14px'>" +
      t("reapply") + "</button>" +
    "<h4 style='margin:22px 0 6px;font-size:13px'>" + t("endpoint") + "</h4>" +
    "<table class='kv'><tr><td>URL</td><td><code>" + ((L3.meta.fhir||{}).endpoint || "—") +
      "</code></td></tr><tr><td>" + t("queue") + "</td><td>" + fhirQueue.length +
      (fhirQueue.length ? " &nbsp;<button type='button' id='btnFlush' class='btn ghost' style='padding:4px 10px;font-size:12px'>" + t("retry") + "</button>" : "") +
      "</td></tr></table>" +
    "<h4 style='margin:22px 0 6px;font-size:13px'>" + t("derived") + "</h4>" +
    "<table class='kv'>" + dv + "</table>" +
    "<h4 style='margin:22px 0 6px;font-size:13px'>" + t("history") + "</h4>" + hist +
    "<h4 style='margin:22px 0 6px;font-size:13px'>" + t("sources") + "</h4>" +
    "<table class='kv'>" + src + "</table>";

  const fb = b.querySelector("#btnFlush"); if (fb) fb.onclick = () => flushQueue();
  b.querySelector("#btnThr").onclick = () => {
    b.querySelectorAll("[data-thr]").forEach(i => {
      L3.meta.thresholds[i.dataset.thr] = Number(i.value);
    });
    if (validate()) show(classify()); else render();
  };
}

/* ---------- FHIR interface ----------
   Builds a real R4 transaction bundle and POSTs it to the endpoint configured
   in meta.fhir.endpoint. Nothing here is hardcoded: endpoint, patient
   reference, questionnaire canonical and alert recipient all come from the L3.
   If the endpoint is unreachable the bundle is queued (offline first).        */
let fhirQueue = [];

function answerValue(e, v){
  if (e.type === "integer")  return { valueInteger: Number(v) };
  if (e.type === "decimal")  return { valueDecimal: Number(v) };
  if (e.type === "date")     return { valueDate: String(v) };
  if (e.type === "select_one"){
    const opt = (e.options || []).find(o => o.value == v);
    /* System URIs come from meta.terminology_systems — the app knows no code system. */
    const SYS = L3.meta.terminology_systems || {};
    const key = e.terminology ? Object.keys(e.terminology).find(k => SYS[k]) : null;
    const sys = key ? SYS[key] : null;
    const code = key ? e.terminology[key] : null;
    return { valueCoding: Object.assign(
      { code: String(v), display: opt ? tx(opt.label) : String(v) },
      sys ? { system: sys, userSelected: false } : {},
      code ? { extension: [{ url: "http://wundcheck.example/concept", valueCode: String(code) }] } : {}) };
  }
  return { valueString: String(v) };
}

function buildBundle(){
  const cfg  = L3.meta.fhir || {};
  const now  = new Date().toISOString();
  const subj = { reference: cfg.patient_reference || "Patient/example" };

  const items = L3.elements
    .filter(e => e.type !== "calculated" && answers[e.id] !== undefined && answers[e.id] !== "")
    .map(e => ({ linkId: e.id, text: tx(e.label), answer: [answerValue(e, answers[e.id])] }));

  const qr = {
    resourceType: "QuestionnaireResponse", status: "completed",
    questionnaire: (cfg.questionnaire_canonical || "Questionnaire/wundcheck") + "|" + L3.meta.version,
    subject: subj, authored: now, source: subj, item: items
  };

  const obs = {
    resourceType: "Observation", status: "final",
    category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category",
                            code: "survey", display: "Survey" }] }],
    code: (function(c){ return c
             ? { coding: [{ system: c.system, code: c.code, display: c.display }], text: c.text }
             : { text: tx(L3.meta.title) }; })(cfg.observation_code),
    subject: subj, effectiveDateTime: now,
    valueCodeableConcept: { text: lastResult ? lastResult.priority : "not evaluated" },
    component: [
      { code: { text: "Triggering rule" },
        valueString: lastResult && lastResult.rule ? lastResult.rule.id : "" },
      { code: { text: "L3 version" }, valueString: L3.meta.version }
    ].concat((cfg.observation_components || []).map(c =>
      c.type === "integer"
        ? { code: { text: c.label }, valueInteger: Number(derived[c.element] ?? 0) }
        : { code: { text: c.label }, valueString: String(derived[c.element] ?? "") }))
  };

  const entries = [
    { resource: qr,  request: { method: "POST", url: "QuestionnaireResponse" } },
    { resource: obs, request: { method: "POST", url: "Observation" } }
  ];

  /* Alert to the practice — only for ORANGE / RED, to avoid alert fatigue. */
  if (lastResult && (lastResult.priority === "orange" || lastResult.priority === "red")){
    entries.push({ resource: {
      resourceType: "Communication", status: "completed",
      priority: lastResult.priority === "red" ? "stat" : "urgent",
      category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/communication-category",
                              code: "alert", display: "Alert" }] }],
      subject: subj, sent: now,
      recipient: [{ reference: cfg.alert_recipient || "Organization/practice" }],
      payload: [{ contentString: (cfg.alert_prefix || tx(L3.meta.title)) + " " + lastResult.priority.toUpperCase() +
                  " (" + lastResult.rule.id + "): " + tx(lastResult.rule.output) }]
    }, request: { method: "POST", url: "Communication" } });
  }

  return { resourceType: "Bundle", type: cfg.send_mode || "transaction",
           timestamp: now, entry: entries };
}

function setSendStatus(html, cls){
  let el = document.getElementById("sendStatus");
  if (!el){
    el = document.createElement("div");
    el.id = "sendStatus"; el.className = "sendbox";
    document.getElementById("output").appendChild(el);
  }
  el.className = "sendbox " + (cls || "");
  el.innerHTML = html;
}

async function sendToRecord(){
  const cfg = L3.meta.fhir || {};
  if (!cfg.endpoint){ setSendStatus(t("noEndpoint"), "bad"); return; }
  const bundle = buildBundle();
  setSendStatus(t("sending") + " <code>" + cfg.endpoint + "</code> …");
  try{
    const res = await fetch(cfg.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/fhir+json", "Accept": "application/fhir+json" },
      body: JSON.stringify(bundle)
    });
    const txt = await res.text();
    if (!res.ok) throw new Error("HTTP " + res.status + " — " + txt.slice(0, 200));
    let ids = [];
    try{
      const out = JSON.parse(txt);
      ids = (out.entry || []).map(e => (e.response && e.response.location) || "").filter(Boolean);
    }catch(e){}
    setSendStatus("✅ <b>" + t("sent") + "</b><br>" +
      (ids.length ? ids.map(i => "<code>" + i + "</code>").join("<br>") : "<code>HTTP " + res.status + "</code>"),
      "ok");
  }catch(err){
    fhirQueue.push(bundle);
    setSendStatus("📦 <b>" + t("queued") + "</b> (" + fhirQueue.length + ")<br><span class='hint'>" +
      err.message + "</span>", "warn");
  }
  renderDev();
}

async function flushQueue(){
  const cfg = L3.meta.fhir || {};
  const pending = fhirQueue.slice(); fhirQueue = [];
  let ok = 0;
  for (const b of pending){
    try{
      const r = await fetch(cfg.endpoint, { method: "POST",
        headers: { "Content-Type": "application/fhir+json" }, body: JSON.stringify(b) });
      if (r.ok) ok++; else fhirQueue.push(b);
    }catch(e){ fhirQueue.push(b); }
  }
  setSendStatus("↻ " + ok + " " + t("sent") + " · " + fhirQueue.length + " " + t("queued"),
                fhirQueue.length ? "warn" : "ok");
  renderDev();
}

function download(name, obj){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/fhir+json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- wiring ---------- */
document.getElementById("btnEval").onclick = () => {
  if (!validate()){ render(); alert(t("fix")); return; }
  show(classify());
};
document.getElementById("btnNewDay").onclick = () => {
  if (lastResult && lastResult.rule)
    history.push({ priority: lastResult.priority, rule: lastResult.rule.id });
  for (const e of L3.elements)
    /* Reset everything that is not declared "once" in the L3 — the app does
       not know which sections are clinical and which are baseline data. */
    if (!(L3.sections.find(x => x.id === e.section) || {}).once) delete answers[e.id];
  lastResult = null;
  document.getElementById("output").innerHTML = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
};
document.getElementById("btnFhir").onclick = () =>
  download("wundcheck-fhir-bundle.json", buildBundle());
document.getElementById("btnSend").onclick = () => sendToRecord();
document.getElementById("btnLoad").onclick = () => document.getElementById("fileL3").click();
document.getElementById("fileL3").onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      L3 = JSON.parse(r.result);
      answers = {}; derived = {}; history = []; lastResult = null;
      lang = (L3.meta.languages || []).includes(lang) ? lang : (L3.meta.default_language || "en");
      document.getElementById("output").innerHTML = "";
      render();
    }catch(err){ alert("Invalid L3 JSON: " + err.message); }
  };
  r.readAsText(f);
};

":{"en":"Any new restriction of movement at the operated site?","de":"Neue Bewegungseinschränkung an der operierten Stelle?"},"required":true,"options":[{"value":1,"label":{"en":"Yes","de":"Ja"}},{"value":0,"label":{"en":"No","de":"Nein"}}],"terminology":{"snomed":"105504002"},"fhir":"Observation.valueCodeableConcept"},{"id":"dressing_changed_today","de_id":"DE-044","section":"wound","type":"select_one","label":{"en":"Was the dressing changed today?","de":"Verband heute gewechselt?"},"options":[{"value":1,"label":{"en":"Yes","de":"Ja"}},{"value":0,"label":{"en":"No","de":"Nein"}},{"value":2,"label":{"en":"No dressing","de":"Kein Verband"}}],"terminology":{"snomed":"182531007"},"fhir":"Procedure.code","l1_source":"NICE NG125 §1.4.1"},{"id":"southampton_grade","de_id":"DE-045","section":"computed","type":"calculated","label":{"en":"Southampton grade","de":"Southampton-Grad"},"calculation":"(wound_open = 2 or wound_state = 4) ? 'V' : (secretion = 3 ? 'IV' : ((secretion = 1 or secretion = 2) ? 'III' : ((wound_state = 3 or redness_extent >= 3 or swelling >= 2 or warmth = 1) ? 'II' : ((wound_state = 2 or redness_extent = 1 or redness_extent = 2) ? 'I' : '0'))))","terminology":{"snomed":"225552003"},"fhir":"Observation.valueCodeableConcept","l1_source":"Southampton Wound Scoring System"},{"id":"last_classification","de_id":"DE-047","section":"computed","type":"calculated","label":{"en":"Yesterday's classification","de":"Klassifikation von gestern"},"calculation":"previousClassification()","fhir":"Observation"},{"id":"trend_worsening","de_id":"DE-048","section":"computed","type":"calculated","label":{"en":"Deterioration since yesterday","de":"Verschlechterung gegenüber gestern"},"calculation":"severityRank(classification) > severityRank(last_classification) ? 1 : 0","fhir":"Observation.interpretation","l1_source":"CDC/NHSN — new or worsening"},{"id":"check_streak_days","de_id":"DE-049","section":"computed","type":"calculated","label":{"en":"Consecutive days checked","de":"Kontrolltage in Folge"},"calculation":"consecutiveDays()","l1_source":"Fidelity indicator (M&E)"}],"decision_rules":[{"id":"R1","decision":"wound_status","priority":"red","exclusive":true,"when":"temp >= T.fever_red or chills = 1","output":{"en":"EMERGENCY — High fever or chills: contact your practice or the emergency service IMMEDIATELY.","de":"NOTFALL — Hohes Fieber oder Schüttelfrost: Kontaktieren Sie SOFORT Ihre Praxis oder den Notfalldienst."},"annotation":{"en":"Systemic signs of infection have the highest priority (worst-first). Chills can precede measurable fever.","de":"Systemische Infektionszeichen haben höchste Priorität (worst-first). Schüttelfrost kann dem Fieber vorausgehen."},"reference":"CDC/NHSN SSI · sepsis red flags"},{"id":"R2","decision":"wound_status","priority":"red","exclusive":true,"when":"red_streak = 1 or redness_extent = 4","output":{"en":"EMERGENCY — Spreading redness or a red streak: seek medical assessment today (suspected lymphangitis).","de":"NOTFALL — Rötung breitet sich aus / roter Streifen: Noch heute ärztliche Beurteilung (Verdacht auf Lymphangitis)."},"annotation":{"en":"red_streak is deliberately not gated by conditional logic — see bug B-03.","de":"red_streak ist bewusst nicht durch conditional logic gegated — siehe Bug B-03."},"reference":"NICE NG125 §1.4.9"},{"id":"R3","decision":"wound_status","priority":"red","exclusive":true,"when":"wound_open = 2 or bleeding = 2 or wound_state = 4","output":{"en":"EMERGENCY — Open wound, pus or heavy bleeding: contact your practice or the emergency service immediately. Cover the wound with a clean dressing.","de":"NOTFALL — Offene Wunde, Eiter oder starke Blutung: Sofort Praxis / Notfall kontaktieren. Wunde mit sauberer Kompresse abdecken."},"annotation":{"en":"Worst-first: the 'open / pus' image always escalates, even if everything else is unremarkable.","de":"Worst-first: Das Wundbild 'offen/Eiter' eskaliert immer, auch wenn alles andere unauffällig ist."},"reference":"CDC/NHSN deep incisional SSI · Southampton IV–V"},{"id":"R9","decision":"wound_status","priority":"orange","exclusive":true,"when":"wellbeing = 2 or nausea_vomiting = 2","output":{"en":"SUSPECTED INFECTION — You feel markedly unwell: contact your practice today, even if the wound looks unremarkable.","de":"INFEKTIONSVERDACHT — Sie fühlen sich deutlich krank: Kontaktieren Sie heute Ihre Praxis, auch wenn die Wunde unauffällig aussieht."},"annotation":{"en":"A severe subjective sense of illness can precede measurable fever. Added after bug B-02.","de":"Schweres subjektives Krankheitsgefühl kann messbarem Fieber vorausgehen. Ergänzt nach Bug B-02."},"reference":"Systemic signs of infection"},{"id":"R4","decision":"wound_status","priority":"orange","exclusive":true,"when":"secretion = 3 or secretion_smell = 1","output":{"en":"SUSPECTED INFECTION — Purulent or foul-smelling discharge: contact your practice today for an appointment.","de":"INFEKTIONSVERDACHT — Eitriges oder übelriechendes Sekret: Kontaktieren Sie heute Ihre Praxis für einen Termin."},"annotation":{"en":"Purulent drainage is a primary criterion of superficial incisional SSI.","de":"Eitriges Sekret ist ein Hauptkriterium der oberflächlichen SSI."},"reference":"CDC/NHSN superficial incisional SSI · Southampton IV"},{"id":"R5","decision":"wound_status","priority":"orange","exclusive":true,"when":"fever = 1 or (pain >= T.pain_high and pain_trend = 2 and days_post_op >= T.normal_healing_days)","output":{"en":"SUSPECTED INFECTION — Fever or increasing severe pain: contact your practice today.","de":"INFEKTIONSVERDACHT — Fieber oder zunehmende starke Schmerzen: Kontaktieren Sie heute Ihre Praxis."},"annotation":{"en":"Pain should decrease from day 3 onwards; an increase is a warning sign.","de":"Schmerz sollte ab Tag 3 rückläufig sein; Zunahme ist ein Warnzeichen."},"reference":"CDC/NHSN · NICE NG125"},{"id":"R11","decision":"wound_status","priority":"orange","exclusive":true,"when":"secretion >= 1 and discharge_duration_days >= T.discharge_prolonged_days","output":{"en":"SUSPECTED INFECTION — Persistent wound discharge over several days: contact your practice today.","de":"INFEKTIONSVERDACHT — Anhaltendes Wundsekret seit mehreren Tagen: Kontaktieren Sie heute Ihre Praxis."},"annotation":{"en":"Southampton lists prolonged discharge (>3 days) as its own sub-grade IIId.","de":"Southampton führt anhaltendes Sekret (>3 Tage) als eigenen Sub-Grade IIId."},"reference":"Southampton IIId"},{"id":"R12","decision":"wound_status","priority":"orange","exclusive":true,"when":"classification = 'yellow' and last_classification = 'yellow'","output":{"en":"SUSPECTED INFECTION — Second abnormal day in a row: contact your practice today.","de":"INFEKTIONSVERDACHT — Zweiter auffälliger Tag in Folge: Kontaktieren Sie heute Ihre Praxis."},"annotation":{"en":"A single abnormal day is tolerable; a persisting abnormal finding is not. Originally specified as 'deterioration vs. yesterday', which was unreachable — any deterioration beyond yellow already triggers a higher-priority rule. See bug B-08.","de":"Ein einzelner auffälliger Tag ist tolerabel, ein anhaltender Befund nicht. Ursprünglich als 'Verschlechterung gegenüber gestern' spezifiziert und dadurch unerreichbar — jede Verschlechterung über Gelb hinaus löst bereits eine höher priorisierte Regel aus. Siehe Bug B-08."},"reference":"CDC/NHSN — new or worsening · persistence criterion"},{"id":"R6b","decision":"wound_status","priority":"yellow","exclusive":true,"when":"southampton_grade = 'II' or swelling = 3","output":{"en":"ABNORMAL — Marked signs of inflammation: watch the wound closely and contact your practice if it is no better by tomorrow.","de":"AUFFÄLLIG — Deutliche Entzündungszeichen: Beobachten Sie die Wunde genau und melden Sie sich bei Ihrer Praxis, wenn es bis morgen nicht besser wird."},"annotation":{"en":"Applies from day 1. Marked signs are not normal even early after surgery. Correction of bug B-01.","de":"Gilt ab Tag 1. Starke Zeichen sind auch früh postoperativ nicht normal. Korrektur von Bug B-01."},"reference":"Southampton II · CDC/NHSN"},{"id":"R6a","decision":"wound_status","priority":"yellow","exclusive":true,"when":"southampton_grade = 'I' and days_post_op >= T.normal_healing_days","output":{"en":"ABNORMAL — Persisting signs of inflammation: keep watching and check again tomorrow.","de":"AUFFÄLLIG — Anhaltende Entzündungszeichen: Weiter beobachten und morgen erneut kontrollieren."},"annotation":{"en":"Mild redness is a physiological inflammatory response during the first 2–3 days.","de":"Leichte Rötung ist in den ersten 2–3 Tagen physiologische Entzündungsreaktion."},"reference":"Wound healing phases · Southampton I"},{"id":"R7","decision":"wound_status","priority":"yellow","exclusive":true,"when":"wound_open = 1 or numbness = 1 or mobility_change = 1","output":{"en":"ABNORMAL — Small wound gap, numbness or restricted movement: raise this at your next appointment; contact your practice if it worsens.","de":"AUFFÄLLIG — Kleine Wundlücke, Taubheitsgefühl oder Bewegungseinschränkung: Beim nächsten Kontrolltermin ansprechen; bei Verschlechterung Praxis kontaktieren."},"reference":"Follow-up care standards"},{"id":"R10","decision":"wound_status","priority":"yellow","exclusive":true,"when":"bleeding >= 1 and anticoag = 1","output":{"en":"ABNORMAL — Bleeding while on blood thinners: watch the dressing and report any increase.","de":"AUFFÄLLIG — Blutung unter Blutverdünnung: Beobachten Sie den Verband und melden Sie sich bei Zunahme."},"annotation":{"en":"Bleeding must be judged differently under anticoagulation. Added after bug B-05.","de":"Blutung ist unter Antikoagulation anders zu bewerten. Ergänzt nach Bug B-05."},"reference":"Bleeding assessment"},{"id":"R8","decision":"wound_status","priority":"green","exclusive":true,"when":"true","output":{"en":"ALL CLEAR — Wound healing is progressing normally. Please check again tomorrow. If you are worried, contact your practice at any time.","de":"ALLES IM GRÜNEN BEREICH — Die Wundheilung verläuft normal. Machen Sie morgen die nächste Kontrolle. Bei Sorgen können Sie sich jederzeit melden."},"annotation":{"en":"Catch-all rule: fires only when none of the rules above applies. Never phrased as 'everything is fine' without a contact hint.","de":"Catch-all-Regel: greift nur, wenn keine der obigen Regeln zutrifft. Nie 'alles in Ordnung' ohne Kontakthinweis."}},{"id":"I1","decision":"advice","priority":"info","exclusive":false,"when":"risk_count >= 2","output":{"en":"You have several risk factors for impaired wound healing — please attend all follow-up appointments.","de":"Sie haben mehrere Risikofaktoren für Wundheilungsstörungen — nehmen Sie alle Kontrolltermine wahr."},"reference":"SSI risk factors"},{"id":"I2","decision":"advice","priority":"info","exclusive":false,"when":"meds_taken = 0","output":{"en":"Please take your prescribed medication — it protects wound healing.","de":"Bitte nehmen Sie Ihre verordneten Medikamente ein — sie schützen die Wundheilung."}},{"id":"I3","decision":"advice","priority":"info","exclusive":false,"when":"smoker = 1","output":{"en":"Smoking slows wound healing — now would be a good moment for a break.","de":"Rauchen verlangsamt die Wundheilung — jetzt wäre ein guter Moment für eine Pause."},"reference":"SSI risk factors"},{"id":"I4","decision":"advice","priority":"info","exclusive":false,"when":"crust = 1","output":{"en":"A scab is a normal sign of healing — do not pick it off, and keep the wound dry.","de":"Wundschorf ist ein normales Zeichen der Heilung — nicht abkratzen, Wunde trocken halten."},"annotation":{"en":"Design decision: a scab is NOT a warning sign; warning rules take precedence (worst-first). See challenge C-04.","de":"Designentscheid: Kruste ist KEIN Warnzeichen; Warn-Regeln haben Vorrang (worst-first). Siehe Challenge C-04."},"reference":"Wound healing phases"},{"id":"I5","decision":"advice","priority":"info","exclusive":false,"when":"bmi >= T.bmi_risk or wound_class >= 3","outp
