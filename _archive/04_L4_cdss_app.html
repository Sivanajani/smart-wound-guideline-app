<!DOCTYPE html>
<html lang="de">

<meta charset="UTF-8">

<title>Mini-CDSS — L4 (FHNW MSc MI)</title>
<!-- ================================================================
     L4: Ausführbare Schicht des Mini-CDSS
     FHNW MSc Medical Informatics · CDSS Modul 2026

     WICHTIG: Diese App enthält KEINE klinische Logik im Code.
     Fragen, Conditional Logic, Berechnungen, Constraints und
     Entscheidungsregeln kommen vollständig aus der L3-Definition
     (JSON, unten eingebettet oder per "L3 laden" austauschbar).
     Selbst-enthaltend: React ist eingebettet, laeuft komplett offline.
     ================================================================ -->
<style>
  :root {
    --blue: #1F4E78; --blue-light: #eaf1f8; --bg: #f5f7fa; --card: #ffffff;
    --text: #1a2733; --muted: #64748b; --border: #d9e2ec;
    --red: #c0392b; --orange: #d97706; --yellow: #b7950b; --green: #1e8449; --info: #2471a3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header.app { background: var(--blue); color: #fff; padding: 18px 16px; }
  header.app .wrap { padding: 0; max-width: 860px; margin: 0 auto; }
  header.app h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  header.app .sub { opacity: .85; font-size: .8rem; margin-top: 4px; }
  .toolbar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; align-items: center; }
  .toolbar .spacer { flex: 1; }
  button, label.filebtn {
    background: var(--blue); color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: .9rem; cursor: pointer; font-family: inherit;
  }
  button.secondary, label.filebtn { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 1rem; color: var(--blue); border-bottom: 2px solid var(--blue-light); padding-bottom: 8px; }
  .field { margin-bottom: 14px; }
  .field label.q { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 5px; }
  .field .req { color: var(--red); }
  .field input[type=text], .field input[type=number], .field input[type=date], .field select {
    width: 100%; max-width: 380px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: .95rem; font-family: inherit; background: #fff;
  }
  .field input.invalid { border-color: var(--red); background: #fdf2f0; }
  .field .err { color: var(--red); font-size: .8rem; margin-top: 4px; }
  .field .mapping { color: var(--muted); font-size: .72rem; margin-top: 3px; }
  .calc { background: var(--blue-light); border-radius: 6px; padding: 8px 12px; display: inline-block; font-size: .95rem; }
  .calc b { font-size: 1.05rem; }
  .radio-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .radio-row label { font-size: .9rem; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .rec { border-left: 6px solid var(--info); border-radius: 8px; background: #fff; padding: 12px 16px; margin-bottom: 10px; border: 1px solid var(--border); }
  .rec .tag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .rec .out { font-size: .95rem; margin: 4px 0; font-weight: 600; }
  .rec .note, .rec .ref { font-size: .78rem; color: var(--muted); }
  .rec.red { border-left-color: var(--red); }    .rec.red .tag { color: var(--red); }
  .rec.orange { border-left-color: var(--orange); } .rec.orange .tag { color: var(--orange); }
  .rec.yellow { border-left-color: var(--yellow); } .rec.yellow .tag { color: var(--yellow); }
  .rec.green { border-left-color: var(--green); }  .rec.green .tag { color: var(--green); }
  .rec.info { border-left-color: var(--info); }   .rec.info .tag { color: var(--info); }
  .disclaimer { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 24px; }
  .missing { color: var(--red); font-size: .85rem; }
  .pill { background: var(--blue-light); color: var(--blue); border-radius: 999px; padding: 3px 10px; font-size: .75rem; }

  .img-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .img-opt { border: 2px solid var(--border); border-radius: 10px; padding: 8px; cursor: pointer;
             text-align: center; background: #fff; width: 132px; transition: border-color .15s, box-shadow .15s; }
  .img-opt:hover { border-color: var(--blue); }
  .img-opt.sel { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); background: var(--blue-light); }
  .img-opt img { width: 100%; height: auto; border-radius: 6px; display: block; }
  .img-opt .img-label { font-size: .78rem; margin-top: 6px; font-weight: 600; }
</style>
</head>

  "decision_rules": [
    { "id": "R1", "decision": "Wundstatus", "when": "temp >= 39 or chills = 1",
      "output": "NOTFALL — Hohes Fieber oder Schüttelfrost: Kontaktieren Sie SOFORT Ihre Praxis oder den Notfalldienst (Verdacht auf sich ausbreitende Infektion).",
      "priority": "red", "annotation": "Systemische Infektionszeichen haben höchste Priorität (worst-first).", "reference": "CDC/NHSN SSI; Sepsis-Red-Flags" },
    { "id": "R2", "decision": "Wundstatus", "when": "redness = 3",
      "output": "NOTFALL — Rötung breitet sich aus / roter Streifen: Noch heute ärztliche Beurteilung (Verdacht auf Lymphangitis).",
      "priority": "red", "reference": "NICE NG125" },
    { "id": "R3", "decision": "Wundstatus", "when": "wound_open = 2 or bleeding = 2 or wound_state = 4",
      "output": "NOTFALL — Offene Wunde, Eiter oder starke Blutung: Sofort Praxis / Notfall kontaktieren. Wunde mit sauberer Kompresse abdecken.",
      "priority": "red", "annotation": "Worst-first: Das Wundbild 'offen/Eiter' eskaliert immer, auch wenn andere Angaben unauffällig sind.", "reference": "Postop. Nachsorge-Standards" },
    { "id": "R4", "decision": "Wundstatus", "when": "secretion = 3 or secretion_smell = 1",
      "output": "INFEKTIONSVERDACHT — Eitriges oder übelriechendes Sekret: Kontaktieren Sie heute Ihre Praxis für einen Termin.",
      "priority": "orange", "annotation": "Eitriges Sekret ist ein Hauptkriterium der oberflächlichen SSI.", "reference": "CDC/NHSN SSI-Kriterium" },
    { "id": "R5", "decision": "Wundstatus", "when": "temp >= 38 or (pain >= 7 and pain_trend = 2 and days_post_op >= 3)",
      "output": "INFEKTIONSVERDACHT — Fieber oder zunehmende starke Schmerzen: Kontaktieren Sie heute Ihre Praxis.",
      "priority": "orange", "annotation": "Schmerz sollte ab Tag 3 rückläufig sein; Zunahme ist ein Warnzeichen.", "reference": "NICE NG125" },
    { "id": "R6", "decision": "Wundstatus", "when": "(wound_state = 3 or redness = 2 or swelling >= 2 or warmth = 1) and days_post_op >= 3",
      "output": "AUFFÄLLIG — Zunehmende Entzündungszeichen: Beobachten Sie die Wunde genau und melden Sie sich bei Ihrer Praxis, wenn es bis morgen nicht besser wird.",
      "priority": "yellow", "annotation": "Leichte Rötung/Schwellung ist in den ersten 2–3 Tagen normal (Wundheilungsphase).", "reference": "Wundheilungsphasen" },
    { "id": "R7", "decision": "Wundstatus", "when": "wound_open = 1 or numbness = 1",
      "output": "AUFFÄLLIG — Kleine Wundlücke oder neues Taubheitsgefühl: Beim nächsten Kontrolltermin ansprechen; bei Verschlechterung Praxis kontaktieren.",
      "priority": "yellow", "reference": "Postop. Nachsorge-Standards" },
    { "id": "R8", "decision": "Wundstatus", "when": "true",
      "output": "ALLES IM GRÜNEN BEREICH — Die Wundheilung verläuft normal. Machen Sie morgen die nächste Kontrolle.",
      "priority": "green", "annotation": "Catch-all-Regel: greift nur, wenn keine der obigen Regeln zutrifft.", "reference": "—" },
    { "id": "I1", "decision": "Hinweis", "exclusive": false, "when": "risk_count >= 2",
      "output": "Sie haben mehrere Risikofaktoren für Wundheilungsstörungen — nehmen Sie alle Kontrolltermine wahr.",
      "priority": "info", "reference": "SSI-Risikofaktoren" },
    { "id": "I2", "decision": "Hinweis", "exclusive": false, "when": "meds_taken = 0",
      "output": "Bitte nehmen Sie Ihre verordneten Medikamente ein — sie schützen die Wundheilung.",
      "priority": "info", "reference": "—" },
    { "id": "I3", "decision": "Hinweis", "exclusive": false, "when": "smoker = 1",
      "output": "Rauchen verlangsamt die Wundheilung — jetzt wäre ein guter Moment für eine Pause.",
      "priority": "info", "reference": "SSI-Risikofaktoren" },
    { "id": "I4", "decision": "Hinweis", "exclusive": false, "when": "crust = 1",
      "output": "Wundschorf (Kruste) ist ein normales Zeichen der Heilung — nicht abkratzen, Wunde trocken halten.",
      "priority": "info", "annotation": "Designentscheid: Kruste ist KEIN Warnzeichen; Warn-Regeln haben Vorrang (worst-first).", "reference": "Wundheilungsphasen" }
  ]
}
</script>
